<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: blob:;" />
  <title>MONO CHROME — QR</title>
  <style>
    :root {
      --ink: #0c1220;
      --crimson: #b42318;
      --paper: #f3eee6;
      --card: #fffdf8;
      --line: #d9d0c4;
      --muted: #5c6570;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }
    header { padding: 18px 16px 6px; }
    .brand { font-size: 11px; letter-spacing: .28em; color: var(--crimson); font-weight: 800; }
    h1 { margin: 6px 0 0; font-size: 22px; }
    .lead { color: var(--muted); font-size: 14px; margin: 6px 0 0; line-height: 1.5; }
    main { padding: 10px 16px 32px; display: grid; gap: 12px; }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
    }
    h2 { margin: 0 0 10px; font-size: 15px; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      font: inherit;
      font-size: 16px;
      background: #fff;
    }
    .tabs, .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 10px 14px;
      font: inherit;
      cursor: pointer;
    }
    button.active, button.primary { background: var(--crimson); color: #fff; border-color: var(--crimson); }
    .qr-box { display: grid; place-items: center; min-height: 260px; background: #fff; border-radius: 12px; }
    canvas { width: min(260px, 86vw); height: auto; }
    .status { text-align: center; font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 1.4em; }
    .status.ok { color: #1f7a3a; }
    .status.err { color: var(--crimson); }
    .actions { margin-top: 12px; }
    .actions button { flex: 1; min-height: 46px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">MONO CHROME</div>
    <h1>FOR IVD SOLUTIONS</h1>
    <p class="lead">اكتب بيانات التواصل تحت. الـ QR بيتحدّث فورًا وأنت بتكتب.</p>
  </header>
  <main>
    <section class="panel">
      <h2>1) بيانات التواصل</h2>
      <label>الهاتف</label>
      <input id="phone" inputmode="tel" autocomplete="tel" value="+20 12 0000 0000" />
      <label>واتساب (برقم الدولة بدون +)</label>
      <input id="whatsapp" inputmode="numeric" value="201200000000" />
      <label>الإيميل</label>
      <input id="email" inputmode="email" autocomplete="email" value="info@monochrome-ivd.com" />
      <label>الموقع</label>
      <input id="website" inputmode="url" value="https://monochrome-ivd.com" />
      <label>اسم الشركة</label>
      <input id="name" value="MONO CHROME FOR IVD SOLUTIONS" />
      <label>العنوان</label>
      <input id="address" value="القاهرة الجديدة، مصر" />
    </section>

    <section class="panel">
      <h2>2) نوع الـ QR</h2>
      <div class="tabs" id="types">
        <button type="button" data-kind="vcard" class="active">كارت اتصال</button>
        <button type="button" data-kind="whatsapp">واتساب</button>
        <button type="button" data-kind="phone">هاتف</button>
        <button type="button" data-kind="email">إيميل</button>
        <button type="button" data-kind="website">موقع</button>
      </div>
      <div class="qr-box"><canvas id="qr" width="280" height="280"></canvas></div>
      <div class="status" id="status">جاري إنشاء الـ QR…</div>
      <div class="actions">
        <button type="button" class="primary" id="refresh">حدّث الـ QR</button>
        <button type="button" id="save">حفظ الصورة</button>
      </div>
    </section>
  </main>

  <!-- استخدام CDN مستقر لمكتبة qrcode -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

  <script>
    const KEYS = ["name", "phone", "whatsapp", "email", "website", "address"];
    const $ = (id) => document.getElementById(id);
    let kind = "vcard";

    function loadSaved() {
      try {
        const saved = JSON.parse(localStorage.getItem("mc-profile") || "{}");
        KEYS.forEach((k) => { if (saved[k]) $(k).value = saved[k]; });
        if (saved.kind) kind = saved.kind;
      } catch (e) {}
    }
    function persist() {
      const data = { kind };
      KEYS.forEach((k) => { data[k] = $(k).value; });
      localStorage.setItem("mc-profile", JSON.stringify(data));
    }
    function payload() {
      const name = $("name").value.trim() || "MONO CHROME";
      const phone = $("phone").value.trim();
      const email = $("email").value.trim();
      const website = $("website").value.trim();
      const address = $("address").value.trim();
      const wa = $("whatsapp").value.replace(/\D/g, "");
      if (kind === "phone") return "tel:" + phone.replace(/\s/g, "");
      if (kind === "email") return "mailto:" + email;
      if (kind === "website") return website || "https://monochrome-ivd.com";
      if (kind === "whatsapp") return "https://wa.me/" + wa;
      return [
        "BEGIN:VCARD",
        "VERSION:3.0",
        "FN:" + name,
        "ORG:" + name,
        "TEL;TYPE=WORK,VOICE:" + phone,
        "EMAIL:" + email,
        "URL:" + website,
        "ADR;TYPE=WORK:;;" + address,
        "END:VCARD"
      ].join("\n");
    }
    function setStatus(msg, cls) {
      const el = $("status");
      el.textContent = msg;
      el.className = "status" + (cls ? " " + cls : "");
    }
    function draw() {
      persist();
      const canvas = $("qr");
      const ctx = canvas.getContext("2d");
      try {
        if (typeof qrcode !== "function") throw new Error("مكتبة QR غير موجودة");
        const text = payload();
        const qr = qrcode(0, "M");
        qr.addData(text);
        qr.make();
        const n = qr.getModuleCount();
        const scale = Math.max(4, Math.floor(280 / n));
        const dim = n * scale;
        canvas.width = dim;
        canvas.height = dim;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, dim, dim);
        ctx.fillStyle = "#0c1220";
        for (let r = 0; r < n; r++) {
          for (let c = 0; c < n; c++) {
            if (qr.isDark(r, c)) ctx.fillRect(c * scale, r * scale, scale, scale);
          }
        }
        setStatus("الـ QR محدّث ببياناتك الحالية", "ok");
      } catch (err) {
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        setStatus("تعذر إنشاء الـ QR. اضغط حدّث الـ QR", "err");
      }
    }

    loadSaved();
    document.querySelectorAll("#types button").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.kind === kind);
      btn.addEventListener("click", () => {
        kind = btn.dataset.kind;
        document.querySelectorAll("#types button").forEach((b) => b.classList.toggle("active", b === btn));
        draw();
      });
    });
    KEYS.forEach((k) => {
      const el = $(k);
      ["input", "change", "keyup", "paste"].forEach((ev) => el.addEventListener(ev, draw));
    });
    $("refresh").addEventListener("click", draw);
    $("save").addEventListener("click", () => {
      draw();
      const a = document.createElement("a");
      a.href = $("qr").toDataURL("image/png");
      a.download = "monochrome-qr.png";
      a.click();
    });
    draw();
  </script>
</body>
</html>
